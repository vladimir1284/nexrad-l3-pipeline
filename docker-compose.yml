# Stack para Docker Swarm (nodo único). Deploy:
#
#   set -a; source .env; set +a          # variables no-secretas
#   docker stack config -c docker-compose.yml | docker stack deploy -c - nexrad
#
# (docker stack deploy no interpola ${VARS}; docker stack config sí.)
#
# Secrets (una vez):
#   printf '%s' "$R2_ACCESS_KEY_ID"          | docker secret create nexrad_r2_access_key_id -
#   printf '%s' "$R2_SECRET_ACCESS_KEY"      | docker secret create nexrad_r2_secret_access_key -
#   printf '%s' "$PG_PASSWORD"               | docker secret create nexrad_pg_password -
#   printf '%s' "$NEXRAD_API_TOKEN_OPS"      | docker secret create nexrad_api_token_ops -
#   printf '%s' "$BETTERSTACK_SOURCE_TOKEN"  | docker secret create nexrad_betterstack_source_token -
#
# Postgres self-hosted (reemplaza a Cloudflare D1 — agotaba la cuota del
# plan gratuito). `postgres` está pineado a un nodo etiquetado
# (`node.labels.pgdata==true`) porque el Swarm es de nodo único hoy y un
# volumen local basta; no hay HA de base de datos a esta escala.
# `pg-backup` hace un dump nocturno a R2 (mismas credenciales R2 de
# arriba) — ver scripts/pg-backup.sh.
#
# `api` es la única pieza Cloudflare-side que sigue cruzando la frontera
# hacia este Swarm: el Worker `nexrad-l3-ops` (workers/ops/) le hace
# fetch() en vez de abrir SQL directo — un Worker no puede conectar TCP
# a Postgres sin meter Hyperdrive+Tunnel+Access de por medio, y `ops`
# debe poder alertar aunque el VPS entero muera, así que sigue viviendo
# fuera del Swarm a propósito (ver api/README.md). `lamula-webviewer`
# (el otro consumidor) y `ingest/` (poller/processor/wind/lightning, acá
# abajo) hablan Postgres DIRECTO por la red interna del Swarm — ninguno
# de los dos pasa por `api`.
#
# Viento (GFS) y rayos (GLM) corren en `wind`/`lightning`: vivían en los
# Workers `nexrad-l3-wind`/`nexrad-l3-lightning`, pero el plan Free de
# Workers no permite subir `limits.cpu_ms` y el parse HDF5 de GLM lo
# excede casi siempre (ver workers/lightning/README.md).

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${PG_DB:-nexrad_l3}
      POSTGRES_USER: ${PG_USER:-nexrad}
      POSTGRES_PASSWORD_FILE: /run/secrets/nexrad_pg_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    secrets:
      - nexrad_pg_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-nexrad} -d ${PG_DB:-nexrad_l3}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      replicas: 1
      placement:
        constraints: [node.labels.pgdata == true]
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 512M

  api:
    image: ghcr.io/vladimir1284/nexrad-l3-api:${IMAGE_TAG:-latest}
    environment:
      PG_HOST: postgres
      PG_DB: ${PG_DB:-nexrad_l3}
      PG_USER: ${PG_USER:-nexrad}
      PG_PASSWORD_FILE: /run/secrets/nexrad_pg_password
      NEXRAD_API_TOKEN_OPS_FILE: /run/secrets/nexrad_api_token_ops
    secrets:
      - nexrad_pg_password
      - nexrad_api_token_ops
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 256M
    # Exposición pública: labels del reverse proxy del Swarm (Traefik) a
    # completar contra la config real — ver plan de migración §1.3.

  pg-backup:
    image: postgres:16-alpine
    entrypoint: ["/bin/sh", "/backup.sh"]
    environment:
      PG_HOST: postgres
      PG_DB: ${PG_DB:-nexrad_l3}
      PG_USER: ${PG_USER:-nexrad}
      PG_PASSWORD_FILE: /run/secrets/nexrad_pg_password
      R2_ENDPOINT: ${R2_ENDPOINT}
      R2_BUCKET: ${R2_BUCKET}
      R2_ACCESS_KEY_ID_FILE: /run/secrets/nexrad_r2_access_key_id
      R2_SECRET_ACCESS_KEY_FILE: /run/secrets/nexrad_r2_secret_access_key
    volumes:
      - ./scripts/pg-backup.sh:/backup.sh:ro
    secrets:
      - nexrad_pg_password
      - nexrad_r2_access_key_id
      - nexrad_r2_secret_access_key
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 256M

  poller:
    image: ghcr.io/vladimir1284/nexrad-l3-pipeline:${IMAGE_TAG:-latest}
    command: ["poll", "/data/incoming", "--interval", "60"]
    environment:
      NEXRAD_SITES: ${NEXRAD_SITES:-AMX,BYX,JUA}
      # NEXRAD_PRODUCTS: sin definir = todos los registrados (F4: N0B)
      BETTERSTACK_HOST: ${BETTERSTACK_HOST}
      BETTERSTACK_SOURCE_TOKEN_FILE: /run/secrets/nexrad_betterstack_source_token
    secrets:
      - nexrad_betterstack_source_token
    volumes:
      - incoming:/data/incoming
    healthcheck:
      test: ["CMD", "l3proc", "health", "--heartbeat", "/data/incoming/.poll_heartbeat", "--max-age", "300"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 5s
      resources:
        limits:
          memory: 256M

  processor:
    image: ghcr.io/vladimir1284/nexrad-l3-pipeline:${IMAGE_TAG:-latest}
    command: ["watch", "/data/incoming"]
    environment:
      R2_ENDPOINT: ${R2_ENDPOINT}
      R2_BUCKET: ${R2_BUCKET}
      PG_HOST: postgres
      PG_DB: ${PG_DB:-nexrad_l3}
      PG_USER: ${PG_USER:-nexrad}
      R2_ACCESS_KEY_ID_FILE: /run/secrets/nexrad_r2_access_key_id
      R2_SECRET_ACCESS_KEY_FILE: /run/secrets/nexrad_r2_secret_access_key
      PG_PASSWORD_FILE: /run/secrets/nexrad_pg_password
      BETTERSTACK_HOST: ${BETTERSTACK_HOST}
      BETTERSTACK_SOURCE_TOKEN_FILE: /run/secrets/nexrad_betterstack_source_token
    secrets:
      - nexrad_r2_access_key_id
      - nexrad_r2_secret_access_key
      - nexrad_pg_password
      - nexrad_betterstack_source_token
    volumes:
      - incoming:/data/incoming
    healthcheck:
      # Solo heartbeat: reiniciar por backlog es contraproducente (el reinicio
      # no vacía nada y pierde el arranque). El backlog atrasado lo detecta el
      # monitor de frescura, que es alerta y no reinicio.
      test: ["CMD", "l3proc", "health", "--heartbeat", "/data/incoming/.heartbeat", "--max-age", "300"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 5s
      resources:
        limits:
          memory: 1G

  wind:
    image: ghcr.io/vladimir1284/nexrad-l3-pipeline:${IMAGE_TAG:-latest}
    command: ["wind", "--interval", "3600", "--lookahead", "4", "--heartbeat", "/tmp/.wind_heartbeat", "--levels", "10m,850hPa,700hPa,500hPa"]
    environment:
      R2_ENDPOINT: ${R2_ENDPOINT}
      R2_BUCKET: ${R2_BUCKET}
      PG_HOST: postgres
      PG_DB: ${PG_DB:-nexrad_l3}
      PG_USER: ${PG_USER:-nexrad}
      R2_ACCESS_KEY_ID_FILE: /run/secrets/nexrad_r2_access_key_id
      R2_SECRET_ACCESS_KEY_FILE: /run/secrets/nexrad_r2_secret_access_key
      PG_PASSWORD_FILE: /run/secrets/nexrad_pg_password
      BETTERSTACK_HOST: ${BETTERSTACK_HOST}
      BETTERSTACK_SOURCE_TOKEN_FILE: /run/secrets/nexrad_betterstack_source_token
    secrets:
      - nexrad_r2_access_key_id
      - nexrad_r2_secret_access_key
      - nexrad_pg_password
      - nexrad_betterstack_source_token
    healthcheck:
      test: ["CMD", "l3proc", "health", "--heartbeat", "/tmp/.wind_heartbeat", "--max-age", "4200"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 5s
      resources:
        limits:
          memory: 512M

  lightning:
    image: ghcr.io/vladimir1284/nexrad-l3-pipeline:${IMAGE_TAG:-latest}
    command: ["lightning", "--interval", "60", "--heartbeat", "/tmp/.lightning_heartbeat"]
    environment:
      R2_ENDPOINT: ${R2_ENDPOINT}
      R2_BUCKET: ${R2_BUCKET}
      PG_HOST: postgres
      PG_DB: ${PG_DB:-nexrad_l3}
      PG_USER: ${PG_USER:-nexrad}
      R2_ACCESS_KEY_ID_FILE: /run/secrets/nexrad_r2_access_key_id
      R2_SECRET_ACCESS_KEY_FILE: /run/secrets/nexrad_r2_secret_access_key
      PG_PASSWORD_FILE: /run/secrets/nexrad_pg_password
      BETTERSTACK_HOST: ${BETTERSTACK_HOST}
      BETTERSTACK_SOURCE_TOKEN_FILE: /run/secrets/nexrad_betterstack_source_token
    secrets:
      - nexrad_r2_access_key_id
      - nexrad_r2_secret_access_key
      - nexrad_pg_password
      - nexrad_betterstack_source_token
    healthcheck:
      test: ["CMD", "l3proc", "health", "--heartbeat", "/tmp/.lightning_heartbeat", "--max-age", "300"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 5s
      resources:
        limits:
          memory: 512M

volumes:
  incoming:
  pgdata:

secrets:
  nexrad_r2_access_key_id:
    external: true
  nexrad_r2_secret_access_key:
    external: true
  nexrad_pg_password:
    external: true
  nexrad_api_token_ops:
    external: true
  nexrad_betterstack_source_token:
    external: true
