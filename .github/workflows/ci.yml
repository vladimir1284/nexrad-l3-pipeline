name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    env:
      # MinIO local como R2 para los tests de integración S3.
      R2_ENDPOINT: http://localhost:9000
      R2_BUCKET: nexrad-test
      R2_ACCESS_KEY_ID: minioadmin
      R2_SECRET_ACCESS_KEY: minioadmin
      # Postgres efímero del job (servicio de abajo) para los tests de
      # integración — a diferencia del D1 de test que reemplaza, no hace
      # falta ningún secret de cuenta: el propio job levanta la base.
      PG_HOST: localhost
      PG_PORT: "5432"
      PG_DB: nexrad_test
      PG_USER: nexrad
      PG_PASSWORD: nexrad
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nexrad_test
          POSTGRES_USER: nexrad
          POSTGRES_PASSWORD: nexrad
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Arrancar MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            quay.io/minio/minio server /data
          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/live && break
            sleep 1
          done
      - run: uv sync --locked
      - name: Aplicar migraciones Postgres
        run: uv run python db/apply_pg_migrations.py "host=localhost port=5432 dbname=nexrad_test user=nexrad password=nexrad"
      - run: uv run pytest

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build

  # api/ es un subproyecto Python aparte (deps propias, sin rasterio/eccodes/h5py).
  api-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  # Imagen única del pipeline (poller + procesador) a ghcr.io, solo en main.
  image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
      # Smoke test DENTRO de la imagen: los tests de pytest corren en el venv
      # del runner y no detectan libs de sistema ausentes en la base slim
      # (p.ej. libexpat que rasterio enlaza del sistema).
      - name: Smoke test de la imagen
        run: |
          docker run --rm --entrypoint python \
            ghcr.io/${{ github.repository }}:${{ github.sha }} \
            -c "import rasterio, metpy, ingest.watcher, ingest.poller; print('imports ok')"

  # Imagen de la API de ops (api/), a ghcr.io, solo en main.
  api-image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [api-test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: api
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-api:latest
            ghcr.io/${{ github.repository }}-api:${{ github.sha }}
